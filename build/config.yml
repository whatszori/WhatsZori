# Project configuration for the Wails v3 CLI.
# After changing `info`, run `wails3 task common:update:build-assets` to regenerate the platform
# files (it overwrites local edits to them).
version: '3'

info:
  companyName: "obzori"
  productName: "WhatsZori"
  productIdentifier: "io.github.whatszori.whatszori"
  description: "WhatsZori client (Whatsapp unofficial client)"
  copyright: "(c) 2026, obzori"
  comments: "Unofficial client, not affiliated with WhatsApp or Meta"
  version: "0.2.0"

# `wails3 dev`: builds the Go side, starts Vite, runs the app, and rebuilds on Go changes.
# The frontend has its own HMR through Vite, so it's ignored here.
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - docs
      - examples
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
